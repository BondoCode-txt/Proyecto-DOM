<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3: Promedio de notas</title>
  <link rel="stylesheet" href="CSS/estilos.css">

  <!--
    REQUISITO: vincula aquí tu propio archivo CSS.
    Ejemplo: <link rel="stylesheet" href="estilos.css">
  -->
</head>
<body>

  <a href="index.html">&larr; Volver al inicio</a>

  <h1>Ejercicio 3: Calcular el promedio de 3 notas</h1>

  <h2>Descripción del ejercicio</h2>
  <p>
    Se pide calcular el promedio de 3 notas ingresadas por el usuario y
    mostrar el resultado en el input de resultado.
  </p>

  <!--
    Instrucciones:
    1. Los inputs no tienen id ni name: accede a ellos desde tu JS recorriendo
       el DOM del formulario.
    2. Agrega el atributo onclick al botón "Calcular promedio", apuntando a
       una función de tu JS.
    3. Opcional: valida que las notas estén en un rango válido (por ejemplo
       entre 0 y 5, o entre 0 y 10, según el sistema que uses).
    4. El promedio es un campo de promedio: antes de mostrarlo, fórmatealo
       con toFixed(2) para que quede con dos decimales.
    5. Crea y vincula tu propio CSS y tu propio JS.
  -->

  <form>
    <p>
      <label>Nota 1: <input type="number" id="nota1" step="0.1" placeholder="Nota 1"></label>
    </p>
    <p>
      <label>Nota 2: <input type="number" id="nota2" step="0.1" placeholder="Nota 2"></label>
    </p>
    <p>
      <label>Nota 3: <input type="number" id="nota3" step="0.1" placeholder="Nota 3"></label>
    </p>

    <p>
      <button type="button" onclick="Calcular()">Calcular promedio</button>
    </p>

    <p>
      <label>Promedio: <input type="text" id="Promedio" placeholder="Promedio" readonly></label>
    </p>
  </form>

  <!--
    REQUISITO: vincula aquí tu propio archivo JS.
    Ejemplo: <script src="promedio.js"></script>
  -->
    <script src="JS/index.js"></script>
</body>
</html>
